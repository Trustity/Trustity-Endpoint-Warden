[workspace]
resolver = "2"
members = ["crates/trustity-audit"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/Trustity/Trustity-Endpoint-Warden"
homepage = "https://trustitylabs.com"
authors = ["Trustity Labs <labs@trustity.co>"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
owo-colors = "4.2"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hostname = "0.4"
